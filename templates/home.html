{% extends "base.html" %}

{% block content %}

<div class="card shadow-sm border-0">
    <div class="card-body p-5 text-center">
        <h1 class="display-5 fw-bold">
            Welcome to VulnWatch
        </h1>

        <p class="lead text-secondary">
            Track open-source package vulnerabilities and security alerts.
        </p>

        {% if user %}
            <a href="/dashboard" class="btn btn-danger">
                Go to Dashboard
            </a>
        {% else %}
            <a href="/login" class="btn btn-danger">
                Login
            </a>
        {% endif %}
    </div>
</div>

{% endblock %}
