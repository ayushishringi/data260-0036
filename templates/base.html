<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ title or "VulnWatch" }}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">VulnWatch</a>

        <div>
            {% if user %}
                <a class="btn btn-outline-light btn-sm" href="/dashboard">
                    Dashboard
                </a>
                <a class="btn btn-danger btn-sm" href="/logout">
                    Logout
                </a>
            {% else %}
                <a class="btn btn-outline-light btn-sm" href="/login">
                    Login
                </a>
            {% endif %}
        </div>
    </div>
</nav>

<main class="container py-5">
    {% block content %}{% endblock %}
</main>

</body>
</html>
