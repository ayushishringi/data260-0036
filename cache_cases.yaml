# HW9 Part 3.1 - labeled semantic-cache test set (s0036, DOMAIN_ID 4: open-source package vulnerabilities).
#
# Labels were written BEFORE any threshold sweep and must not be edited after seeing results.
# Labeling mistakes found later are recorded in reports/hw09/LABEL_NOTES.md instead.
#
# How the set is used (scripts/run_hw9_sweep.py):
#   1. The cache is cleared and the 10 seed_queries are answered by the HW8 agents and cached.
#   2. For each threshold, the 40 cases are asked against that same seeded cache
#      (store_on_miss=false, so every threshold sees an identical cache).
#   expected: hit  -> the correct answer is the cached answer of seed `target`
#   expected: miss -> no cached answer is correct (`near` = the seed it superficially resembles)
#   A false hit = a cache hit whose cached answer is not correct for the incoming query.

