<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HW2 - Vulnerability Reports</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="card">
      <p class="eyebrow">DATA-260 · HW2 · DOMAIN_ID 4</p>

      <h1>Vulnerability Reports</h1>

      <p class="lede">
        Add, update, delete, and search open-source package vulnerability
        reports.
      </p>

      <section aria-labelledby="search-heading">
        <h2 id="search-heading">Search reports</h2>

        <form id="search-form" class="search-row">
          <label class="sr-only" for="search-input">
            Search by package name or affected version
          </label>

          <input
            id="search-input"
            type="search"
            placeholder="Search package or version"
          />

          <button type="submit">Search</button>
          <button type="button" id="clear-search" class="secondary-button">
            Clear
          </button>
        </form>
      </section>

      <section aria-labelledby="reports-heading">
        <div class="section-heading">
          <h2 id="reports-heading">Current reports</h2>
          <span id="report-count" class="count-badge">0 reports</span>
        </div>

        <p id="loading-state" class="state-message" hidden>
          Loading reports...
        </p>

        <p id="empty-state" class="state-message" hidden>
          No vulnerability reports found.
        </p>

        <p id="error-state" class="state-message error-message" hidden>
          Unable to load reports.
        </p>

        <div id="report-list" class="report-list"></div>

        <div class="management-actions">
          <button type="button" id="update-first">
            Update record ID 1
          </button>

          <button type="button" id="delete-highest" class="danger-button">
            Delete highest ID
          </button>
        </div>
      </section>

      <section aria-labelledby="form-heading">
        <h2 id="form-heading">Add a vulnerability report</h2>

        <form id="report-form">
          <label for="packageName">Package name</label>
          <input
            id="packageName"
            name="packageName"
            type="text"
            required
            placeholder="Example: lodash"
          />

          <label for="affectedVersion">Affected version</label>
          <input
            id="affectedVersion"
            name="affectedVersion"
            type="text"
            required
            placeholder="Example: < 4.17.21"
          />

          <label for="submitterEmail">Submitter email</label>
          <input
            id="submitterEmail"
            name="submitterEmail"
            type="email"
            required
            placeholder="you@example.com"
          />

          <label for="description">Vulnerability description</label>
          <textarea
            id="description"
            name="description"
            required
            minlength="26"
            rows="5"
            placeholder="Describe the issue in more than 25 characters."
          ></textarea>

          <label for="severity">Severity</label>
          <select id="severity" name="severity" required>
            <option value="" disabled selected>Select a severity</option>
            <option value="critical">Critical</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>

          <div class="checkbox-row">
            <input id="agreedToTerms" name="agreedToTerms" type="checkbox" />
            <label for="agreedToTerms">
              I agree to the terms and conditions.
            </label>
          </div>

          <button type="submit">Add vulnerability report</button>
        </form>
      </section>

      <pre id="output" class="output" hidden></pre>
    </main>

    <script src="app.js"></script>
  </body>
</html>
