<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bike-share Plan Advisor · s0036</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1d232b; --muted: #5d6875; --line: #dde2e8;
    --accent: #2357c6; --ok: #1d7a46; --warn: #a15c00; --bad: #b3261e; --chip: #eef2f8;
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); }
  header { background: #182234; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between;
           align-items: baseline; flex-wrap: wrap; gap: 8px; }
  header h1 { font-size: 18px; margin: 0; font-weight: 650; }
  header span { color: #b9c4d6; font-size: 13px; }
  main { padding: 18px 24px 32px; max-width: 1400px; margin: 0 auto; }
  form { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px;
         display: grid; grid-template-columns: 1fr 1.4fr auto; gap: 12px 16px; align-items: end; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  input[type=url], input[type=file] { width: 100%; padding: 7px 8px; border: 1px solid var(--line);
         border-radius: 6px; font: inherit; background: #fff; }
  .defenses { grid-column: 1 / -1; display: flex; gap: 18px; font-size: 13px; color: var(--muted); }
  .defenses label { display: inline; font-weight: 400; margin: 0; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 9px 22px;
           font: inherit; font-weight: 650; cursor: pointer; }
  button:disabled { background: #8ea2c9; cursor: progress; }
  .grid { display: grid; grid-template-columns: minmax(320px, 0.9fr) 1.4fr; gap: 16px; margin-top: 16px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px;
            min-width: 0; }
  h2 { font-size: 14px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  h3 { font-size: 13px; margin: 16px 0 6px; color: var(--muted); }
  #status { font-size: 13px; color: var(--muted); }
  .event { border-left: 3px solid var(--line); padding: 4px 0 6px 10px; margin-bottom: 6px; }
  .event.call { border-color: var(--accent); }
  .event.obs { border-color: #9aa7b6; }
  .event.err { border-color: var(--bad); }
  .event.final { border-color: var(--ok); }
  .event .head { font-weight: 600; font-size: 13px; }
  .event .t { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
  .event pre { margin: 3px 0 0; white-space: pre-wrap; word-break: break-word; font: 12px/1.4 Menlo, monospace;
               color: #3a4350; max-height: 140px; overflow: auto; background: #f7f8fa; padding: 5px 6px;
               border-radius: 4px; }
  #timeline { max-height: 78vh; overflow: auto; }
  .decision { font-size: 22px; font-weight: 700; padding: 10px 14px; border-radius: 8px; background: var(--chip); }
  .decision.member { color: var(--ok); }
  .decision.payg { color: var(--accent); }
  .metrics { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
  .metric { background: var(--chip); border-radius: 6px; padding: 6px 10px; font-size: 13px; }
  .metric b { font-variant-numeric: tabular-nums; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border-bottom: 1px solid var(--line); padding: 5px 8px; text-align: left; }
  th { color: var(--muted); font-weight: 600; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .cites li, .assume li { margin-bottom: 4px; }
  .cites q { color: #2b3440; }
  .src { color: var(--muted); font-size: 12px; word-break: break-all; }
  .check-ok { color: var(--ok); font-weight: 600; } .check-bad { color: var(--bad); font-weight: 600; }
  .empty { color: var(--muted); font-style: italic; }
  .scroll { overflow-x: auto; }
  @media (max-width: 900px) { form, .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Bike-share Plan Advisor · Capital Bikeshare</h1>
  <span>DATA-260 HW7 Part 4 · s0036 · Ayushi Shringi · LangGraph ReAct agent on Ollama qwen3:4b</span>
</header>
<main>
  <form id="run-form">
    <div>
      <label for="csv">Trip CSV upload</label>
      <input id="csv" name="trips_csv" type="file" accept=".csv,text/csv" required>
    </div>
    <div>
      <label for="url">Pricing page URL</label>
      <input id="url" name="pricing_url" type="url" value="https://capitalbikeshare.com/pricing" required>
    </div>
    <div><button id="run" type="submit">Run</button></div>
    <div class="defenses">
      <span>Defenses (Part 5):</span>
      <span><input type="checkbox" id="label_untrusted" checked> <label for="label_untrusted">label retrieved text as untrusted</label></span>
      <span><input type="checkbox" id="enforce_readonly" checked> <label for="enforce_readonly">csv_sql read-only SELECT contract</label></span>
      <span id="status">Idle.</span>
    </div>
  </form>

  <div class="grid">
    <section>
      <h2>Timeline · tool calls and observations</h2>
      <div id="timeline"><p class="empty">Upload a CSV and press Run.</p></div>
    </section>
    <section>
      <h2>Results</h2>
      <div id="results"><p class="empty">No result yet.</p></div>
    </section>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = String(text); return n; };
const money = (v) => (typeof v === "number" ? "$" + v.toFixed(2) : (v ?? "—"));
const num = (v) => (typeof v === "number" ? (Number.isInteger(v) ? v : v.toFixed(2)) : (v ?? "—"));
let rendered = 0;

function renderEvent(e) {
  const t = (e.t_ms / 1000).toFixed(1) + "s";
  let box;
  if (e.type === "snapshot") {
    box = el("div", "event obs");
    box.append(el("div", "head", "Pricing snapshot captured "), el("pre", null,
      `${e.url}\naccessed ${e.accessed_at}\nsha256 ${e.sha256}\npages: ${e.pages.join(", ")}`));
  } else if (e.type === "tool_call") {
    box = el("div", "event call");
    const head = el("div", "head", `Step ${e.step} · ${e.tool} `); head.append(el("span", "t", t));
    box.append(head, el("pre", null, JSON.stringify(e.input, null, 1)));
  } else if (e.type === "observation") {
    const okay = e.output && e.output.success;
    box = el("div", "event " + (okay ? "obs" : "err"));
    const head = el("div", "head", `Observation · ${e.tool} · ${okay ? "success" : "error"} `);
    head.append(el("span", "t", `${e.latency_ms} ms`));
    const body = okay ? JSON.stringify(e.output.data, null, 1) : e.output.error;
    box.append(head, el("pre", null, body.length > 1600 ? body.slice(0, 1600) + "\n…" : body));
  } else if (e.type === "harness_check") {
    box = el("div", "event err");
    box.append(el("div", "head", `Harness check · continuation ${e.continuation}`),
      el("pre", null, "Missing: " + e.missing.join("; ")));
  } else if (e.type === "final") {
    box = el("div", "event final");
    box.append(el("div", "head", "Final rationale"), el("pre", null, `${e.decision}\n${e.rationale}`));
  } else { return; }
  $("timeline").append(box);
}

function costTable(final, ref) {
  const table = el("table");
  const head = el("tr"); ["", "Agent", "Reference check"].forEach((h, i) => head.append(el("th", i ? "n" : null, h)));
  table.append(head);
  const rows = [
    ["Pay-per-use total", money(final.pay_per_use_total), money(ref && ref.pay_per_use_total)],
    ["Monthly membership total (incl. residual charges)", money(final.membership_total), money(ref && ref.membership_total)],
    ["30-day periods covered", num(final.periods_30d), num(ref && ref.periods_30d)],
    ["Break-even rides per 30 days", num(final.break_even_rides_per_30d), num(ref && ref.break_even_rides_per_30d)],
    ["Actual rides per 30 days", num(final.actual_rides_per_30d), num(ref && ref.actual_rides_per_30d)],
  ];
  for (const r of rows) { const tr = el("tr"); r.forEach((c, i) => tr.append(el("td", i ? "n" : null, c))); table.append(tr); }
  return table;
}

function renderResult(state) {
  const box = $("results"); box.replaceChildren();
  if (state.status === "error") { box.append(el("p", "check-bad", "Run failed: " + state.error)); return; }
  const r = state.result; const final = r.final || {}; const ref = r.reference_check.costs;
  const decision = final.decision || "No parseable decision";
  box.append(el("div", "decision " + (decision.startsWith("Buy") ? "member" : "payg"), decision));
  const metrics = el("div", "metrics");
  [["Steps", r.metrics.steps], ["Total time", (r.metrics.total_time_ms / 1000).toFixed(1) + " s"],
   ["Stop reason", r.metrics.stop_reason], ["Harness continuations", r.metrics.harness_continuations ?? 0],
   ["Defenses", r.defenses], ["CSV rows", r.csv.rows]]
    .forEach(([k, v]) => { const m = el("div", "metric", k + ": "); m.append(el("b", null, v)); metrics.append(m); });
  box.append(metrics);

  box.append(el("h3", null, "Cost comparison"), costTable(final, ref));
  const match = r.reference_check.agent_matches_reference;
  const check = el("p", match ? "check-ok" : "check-bad",
    ref ? (match ? "Independent recomputation from the CSV and published prices agrees with the decision."
                 : `Independent recomputation recommends "${ref.decision}" — the agent's decision differs.`)
        : "Reference check unavailable (prices not found or data modified).");
  box.append(check);

  box.append(el("h3", null, "Justification"), el("p", null, final.justification || r.final_text || "—"));
  box.append(el("h3", null, "Citations"));
  const cites = el("ol", "cites");
  for (const c of final.citations || []) {
    const li = el("li"); li.append(el("q", null, c.quote), el("div", "src", c.source)); cites.append(li);
  }
  if (!cites.children.length) cites.append(el("li", "empty", "none returned"));
  box.append(cites);
  box.append(el("p", "src", `Pricing page: ${r.snapshot.url} · captured ${r.snapshot.accessed_at} · SHA-256 ${r.snapshot.sha256}`));

  box.append(el("h3", null, "By week (most recent weeks, pay-per-use spend)"));
  const weekly = r.weekly_table || [];
  if (weekly.length) {
    const wrap = el("div", "scroll"); const t = el("table"); const cols = Object.keys(weekly[0]);
    const hr = el("tr"); cols.forEach((c) => hr.append(el("th", c === "week_start" ? null : "n", c))); t.append(hr);
    for (const row of weekly) { const tr = el("tr"); cols.forEach((c) => tr.append(el("td", c === "week_start" ? null : "n", row[c]))); t.append(tr); }
    wrap.append(t); box.append(wrap);
  } else { box.append(el("p", "empty", "The agent did not return a weekly table.")); }

  box.append(el("h3", null, "Assumptions and caveats"));
  const ul = el("ul", "assume");
  for (const a of final.assumptions || []) ul.append(el("li", null, a));
  if (!ul.children.length) ul.append(el("li", "empty", "none returned"));
  box.append(ul);
}

async function poll(runId) {
  const res = await fetch(`/api/bikeshare/runs/${runId}`); const state = await res.json();
  if (rendered === 0 && state.timeline.length) $("timeline").replaceChildren();
  for (; rendered < state.timeline.length; rendered++) renderEvent(state.timeline[rendered]);
  $("timeline").scrollTop = $("timeline").scrollHeight;
  $("status").textContent = `Run ${runId}: ${state.status} · ${state.timeline.filter((e) => e.type === "tool_call").length} tool calls`;
  if (state.status === "done" || state.status === "error") { renderResult(state); $("run").disabled = false; return; }
  setTimeout(() => poll(runId), 1500);
}

$("run-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const form = new FormData();
  form.append("trips_csv", $("csv").files[0]);
  form.append("pricing_url", $("url").value);
  form.append("label_untrusted", $("label_untrusted").checked);
  form.append("enforce_readonly", $("enforce_readonly").checked);
  $("run").disabled = true; rendered = 0;
  $("timeline").replaceChildren(el("p", "empty", "Starting…"));
  $("results").replaceChildren(el("p", "empty", "Running…"));
  const res = await fetch("/api/bikeshare/runs", { method: "POST", body: form });
  const body = await res.json();
  if (!res.ok) { $("status").textContent = body.detail || "Request failed"; $("run").disabled = false; return; }
  poll(body.run_id);
});
</script>
</body>
</html>
