{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card shadow-sm border-0">
            <div class="card-body p-4">

                <h2 class="mb-4">Login</h2>

                {% if error %}
                    <div class="alert alert-danger">
                        {{ error }}
                    </div>
                {% endif %}

                <form method="post" action="/login">

                    <div class="mb-3">
                        <label for="username" class="form-label">
                            Username
                        </label>

                        <input
                            id="username"
                            name="username"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">
                            Password
                        </label>

                        <input
                            id="password"
                            name="password"
                            type="password"
                            class="form-control"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-danger w-100">
                        Login
                    </button>
                </form>

                <p class="text-muted mt-3 mb-0">
                    Demo username: ayushi<br>
                    Demo password: data260
                </p>

            </div>
        </div>

    </div>
</div>

{% endblock %}
