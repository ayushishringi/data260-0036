<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HW1-Ayushi Shringi</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">DATA-260 · HW1 · DOMAIN_ID 4</p>
      <h1>Vulnerability Report</h1>
      <p class="lede">
        File an open-source package vulnerability notice. Required fields are
        marked.
      </p>

      <form id="vuln-form">
        <label for="packageName">Package name</label>
        <input
          id="packageName"
          name="packageName"
          type="text"
          required
          autofocus
          placeholder="Canonical package name, e.g. lodash"
        />

        <label for="affectedVersion">Affected version</label>
        <input
          id="affectedVersion"
          name="affectedVersion"
          type="text"
          required
          placeholder="Version or range, e.g. &lt; 4.17.21"
        />

        <label for="submitterEmail">Submitter email</label>
        <input
          id="submitterEmail"
          name="submitterEmail"
          type="email"
          required
          placeholder="you@sjsu.edu"
        />

        <label for="description">Vulnerability description</label>
        <textarea
          id="description"
          name="description"
          required
          rows="6"
          placeholder="Describe the issue, impact, and how it was discovered (more than 25 characters)."
        ></textarea>

        <label for="severity">Severity</label>
        <select id="severity" name="severity" required>
          <option value="" disabled selected>Select a severity</option>
          <option value="critical">Critical</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>

        <div class="checkbox-row">
          <input id="agreedToTerms" name="agreedToTerms" type="checkbox" />
          <label for="agreedToTerms">I agree to the terms and conditions.</label>
        </div>

        <button type="submit">Report vulnerability</button>
      </form>
      <pre id="output" class="output" hidden></pre>
    </main>
    <script src="app.js"></script>
  </body>
</html>
